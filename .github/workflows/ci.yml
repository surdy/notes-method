name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `dtolnay/rust-toolchain` does not read `rust-toolchain.toml`, so pass the
      # pinned channel explicitly. Keeps that file the single source of truth
      # instead of tracking whatever `@stable` has become today.
      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error file=rust-toolchain.toml::could not read [toolchain] channel"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "Pinned Rust toolchain: $channel"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

  # The `notesmith-tauri` desktop crate is excluded from the workspace (it needs
  # Tauri system libraries), so the `rust` job above never compiles or tests it.
  # This job closes that gap — notably it is the only place the MCP-server
  # credential-redaction tests in `agent_bridge.rs` run in CI. They live in the
  # `notesmith-desktop` bin, so `--bins` is required (a plain `--lib` skips them).
  desktop:
    name: Desktop crate (notesmith-tauri)
    runs-on: ubuntu-latest
    # The desktop crate is not warning-clean yet, and `-D warnings` (set
    # workspace-wide above) would turn this coverage job into a lint-debt
    # blocker. Gate warnings separately when the crate is clean; for now the
    # value here is the tests actually running.
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Resolve pinned toolchain
        id: toolchain
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          if [ -z "$channel" ]; then
            echo "::error file=rust-toolchain.toml::could not read [toolchain] channel"
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/notesmith-tauri

      # `tauri-build` requires the frontend dist to exist (frontendDist points at
      # `ui/app/build`), so the SvelteKit app must be built before the crate
      # compiles — even for a test-only run.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/app/pnpm-lock.yaml
      - name: Build frontend (required by tauri-build)
        working-directory: ui/app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test desktop crate
        run: cargo test --manifest-path crates/notesmith-tauri/Cargo.toml --bins

  sveltekit:
    name: SvelteKit Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui/app
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: ui/app
        run: pnpm build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/app/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ui/app
        run: pnpm install --frozen-lockfile

      # playwright.config.ts declares a single chromium project, so the other
      # engines and their system deps are not worth downloading.
      - name: Install Playwright browser
        working-directory: ui/app
        run: pnpm exec playwright install --with-deps chromium

      # The config's `webServer` block starts `vite dev` on :5173 and, because
      # CI is set, will not reuse a pre-existing server.
      - name: Run e2e tests
        working-directory: ui/app
        run: pnpm test:e2e

      # `trace: 'on-first-retry'` writes traces here; keep them when the suite
      # fails so a red run can be debugged without reproducing locally.
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ui/app/test-results/
          retention-days: 7
          if-no-files-found: ignore
