name: Container Image

on:
  push:
    branches: [main]
    paths:
      # Rebuild whenever source or the image definition changes
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'ui/app/**'
      - 'Containerfile'
      - 'deploy/healthcheck.sh'
  workflow_dispatch: {}   # allow manual builds from the Actions UI

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/surdy/notesmith
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    name: Build & Push (linux/amd64)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Cargo cache ──────────────────────────────────────────────────────
      # Caches ~/.cargo/registry and the build target directory so Rust
      # incremental compilation survives between runs.  The Containerfile
      # uses a separate Docker layer cache (below).
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ── Docker setup ─────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Tags & labels ─────────────────────────────────────────────────────
      # Two image flavors:
      #
      #   app (default / latest)  — binary + SvelteKit frontend bundled
      #                             Use this for browser access on the same network.
      #
      #   api                     — binary only (smaller image)
      #                             For CLI/MCP/API-only access or Tauri desktop
      #                             clients that embed their own frontend.
      #
      # Versioning strategy (pre-release, no semver):
      #
      #   latest / api-latest       — most recent build from main
      #   sha-<7> / api-sha-<7>     — immutable; use in Compose/Quadlet for rollback
      #   YYYY.MM.DD / api-YYYY.MM.DD — date tag; helps reason about when a change shipped
      - name: Generate tags for app flavor
        id: meta-app
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYY.MM.DD'}}
          labels: |
            org.opencontainers.image.title=Notesmith
            org.opencontainers.image.description=Notesmith daemon with bundled frontend
            org.opencontainers.image.url=https://github.com/surdy/notes-method
            org.opencontainers.image.source=https://github.com/surdy/notes-method
            org.opencontainers.image.vendor=surdy

      - name: Generate tags for api flavor
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=api-latest
            type=raw,value=api-edge
            type=sha,prefix=api-sha-,format=short
            type=raw,value=api-{{date 'YYYY.MM.DD'}}
          labels: |
            org.opencontainers.image.title=Notesmith (API only)
            org.opencontainers.image.description=Notesmith daemon without frontend (API/CLI/MCP)
            org.opencontainers.image.url=https://github.com/surdy/notes-method
            org.opencontainers.image.source=https://github.com/surdy/notes-method
            org.opencontainers.image.vendor=surdy

      # ── Build & push: app flavor (default) ───────────────────────────────
      - name: Build and push (app)
        id: build-app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-app.outputs.tags }}
          labels: ${{ steps.meta-app.outputs.labels }}
          # Registry-backed layer cache using the edge tag.
          cache-from: type=registry,ref=${{ env.IMAGE }}:edge
          cache-to: type=registry,ref=${{ env.IMAGE }}:edge,mode=max

      # ── Build & push: api flavor ─────────────────────────────────────────
      - name: Build and push (api)
        id: build-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          target: api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          # Reuse layers already built for the app flavor above.
          cache-from: type=registry,ref=${{ env.IMAGE }}:edge

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## Container images published :package:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** \`${{ env.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### \`app\` flavor (binary + frontend)" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta-app.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### \`api\` flavor (binary only)" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta-api.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
