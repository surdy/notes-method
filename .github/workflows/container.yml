name: Container Image

on:
  push:
    branches: [main]
    paths:
      # Rebuild whenever source or the image definition changes
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'Containerfile'
      - 'deploy/healthcheck.sh'
  workflow_dispatch: {}   # allow manual builds from the Actions UI

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/surdy/notesmith

jobs:
  build-push:
    name: Build & Push (linux/amd64)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Cargo cache ──────────────────────────────────────────────────────
      # Caches ~/.cargo/registry and the build target directory so Rust
      # incremental compilation survives between runs.  The Containerfile
      # uses a separate Docker layer cache (below).
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      # ── Docker setup ─────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Tags & labels ─────────────────────────────────────────────────────
      # Versioning strategy (pre-release, no semver):
      #
      #   latest            — always the most recent build from main
      #   edge              — same image; alias that signals "in active development"
      #   sha-<7-char-sha>  — immutable; use this in Compose/Quadlet for rollback safety
      #   YYYY.MM.DD        — date tag; helps reason about when a change shipped
      #
      # When semver is introduced, add a 'release' workflow that pushes
      # vX.Y.Z and updates 'latest' only on non-pre-release tags.
      - name: Generate tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value=edge
            type=sha,prefix=sha-,format=short
            type=raw,value={{date 'YYYY.MM.DD'}}
          labels: |
            org.opencontainers.image.title=Notesmith
            org.opencontainers.image.description=Notesmith HTTP daemon
            org.opencontainers.image.url=https://github.com/surdy/notes-method
            org.opencontainers.image.source=https://github.com/surdy/notes-method
            org.opencontainers.image.vendor=surdy

      # ── Build & push ──────────────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed layer cache: pulls cached layers from the
          # 'edge' image on GHCR so the Rust compile step is fast after
          # the first successful build.
          cache-from: type=registry,ref=${{ env.IMAGE }}:edge
          cache-to: type=registry,ref=${{ env.IMAGE }}:edge,mode=max

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Write job summary
        run: |
          echo "## Container image published :package:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Registry:** \`${{ env.IMAGE }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags pushed:**" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | sed 's/^/- `/' | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
