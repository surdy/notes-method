[workspace]
members = [
    "crates/notesmith-core",
    "crates/notesmith-vault",
    "crates/notesmith-index",
    "crates/notesmith-query",
    "crates/notesmith-templates",
    "crates/notesmith-routing",
    "crates/notesmith-tasks",
    "crates/notesmith-hooks",
    "crates/notesmith-git",
    "crates/notesmith-html",
    "crates/notesmith-config",
    "crates/notesmith-ops",
    "crates/notesmith-http",
    "crates/notesmith-mcp",
    "crates/notesmith-cli",
    "crates/theme-gen",
]
# notesmith-tauri excluded from default members (requires Tauri deps)
exclude = ["crates/notesmith-tauri", "spikes/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/surdy/notes-method"

[workspace.dependencies]
# Internal crates
notesmith-core = { path = "crates/notesmith-core" }
notesmith-vault = { path = "crates/notesmith-vault" }
notesmith-index = { path = "crates/notesmith-index" }
notesmith-query = { path = "crates/notesmith-query" }
notesmith-templates = { path = "crates/notesmith-templates" }
notesmith-routing = { path = "crates/notesmith-routing" }
notesmith-tasks = { path = "crates/notesmith-tasks" }
notesmith-hooks = { path = "crates/notesmith-hooks" }
notesmith-git = { path = "crates/notesmith-git" }
notesmith-html = { path = "crates/notesmith-html" }
notesmith-config = { path = "crates/notesmith-config" }
notesmith-ops = { path = "crates/notesmith-ops" }
notesmith-http = { path = "crates/notesmith-http" }
notesmith-mcp = { path = "crates/notesmith-mcp" }
notesmith-cli = { path = "crates/notesmith-cli" }

# External dependencies (versions pinned at workspace level)
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
blake3 = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
clap = { version = "4", features = ["derive"] }
palette = "0.7"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "set-header"] }
comrak = "0.36"
rusqlite = { version = "0.35", features = ["bundled"] }
tantivy = "0.22"
minijinja = "2"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
git2 = "0.20"
walkdir = "2"
regex = "1"
globset = "0.4"
dirs = "6"
tempfile = "3"
arboard = "3"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"
arc-swap = "1"
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }
