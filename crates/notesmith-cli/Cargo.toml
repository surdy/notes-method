[package]
name = "notesmith-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
notesmith-core = { workspace = true }
notesmith-config = { workspace = true }
notesmith-vault = { workspace = true }
notesmith-index = { workspace = true }
notesmith-embed = { workspace = true }
notesmith-ingest = { workspace = true }
notesmith-transcribe = { workspace = true }
notesmith-clip = { workspace = true }
notesmith-query = { workspace = true }
notesmith-http = { workspace = true }
notesmith-mcp = { workspace = true }
notesmith-html = { workspace = true }
notesmith-git = { workspace = true }
notesmith-agent = { path = "../notesmith-agent" }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
dirs = { workspace = true }
chrono = { workspace = true }
arboard = { workspace = true }
futures = { workspace = true }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true }

[[bin]]
name = "notesmith"
path = "src/main.rs"

[features]
# Enable real local embeddings (fastembed/ONNX) for `notesmith embed`. Off by
# default so the standard build/tests stay lean (ADR 0018 §8).
local-embed = ["notesmith-embed/local-embed"]
# Enable the real local whisper.cpp engine for `notesmith transcribe`. Off by
# default so the standard build/tests never compile whisper.cpp (ADR 0023 §2).
local-whisper = ["notesmith-transcribe/local-whisper"]
# Enable the YouTube no-caption audio fallback decode (symphonia MP4/AAC) for
# `notesmith transcribe --drain`. Off by default so the standard build/tests
# never compile the audio-codec stack (ADR 0023 §6).
youtube-audio = ["notesmith-clip/youtube-audio"]
