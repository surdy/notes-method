[package]
name = "notesmith-clip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
anyhow = { workspace = true }
thiserror = { workspace = true }
notesmith-transcribe = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
url = "2"
dom_smoothie = "0.18"
htmd = "0.5"
minijinja = { workspace = true }
symphonia = { version = "0.5", default-features = false, features = ["isomp4", "aac"], optional = true }

[features]
# Compiles the symphonia MP4/AAC decode stack for the YouTube no-caption audio
# fallback (ADR 0023 §6). Off by default so the standard workspace gates never
# build the audio-codec stack (mirrors notesmith-transcribe's `local-whisper`).
youtube-audio = ["dep:symphonia"]

[dev-dependencies]
tokio = { workspace = true }
pretty_assertions = { workspace = true }
