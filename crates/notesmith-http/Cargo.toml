[features]
# Real local embeddings (fastembed/ONNX) for the daemon-hosted embed worker and
# query-time embedding. Off by default so the standard daemon build stays lean
# (ADR 0018 §8); without it a non-semantic HashEmbedder placeholder is used.
local-embed = ["notesmith-embed/local-embed"]
# Real local transcription (whisper.cpp) for the daemon-supervised transcribe
# worker. Off by default so the standard daemon build never compiles whisper.cpp
# (ADR 0023 §2); without it the StubTranscriber placeholder is used.
local-whisper = ["notesmith-transcribe/local-whisper"]
