version: 1
defaults:
  on_exists: skip

rules:
  - id: external-meeting
    when:
      all:
        - field.type: meeting
        - field.meeting-kind: external
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/External Meetings/{{ filename }}"

  - id: internal-meeting
    when:
      all:
        - field.type: meeting
        - field.meeting-kind: internal
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/Internal Meetings/{{ filename }}"

  - id: stream
    when:
      field.type: stream
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/Streams/{{ filename }}"

  - id: account-info
    when:
      field.type: account-info
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/Account Info/{{ filename }}"

  - id: glossary
    when:
      field.type: glossary
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/Account Info/{{ filename }}"

  - id: milestones
    when:
      field.type: milestones
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/Account Info/{{ filename }}"

  - id: customer-index
    when:
      field.type: customer
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/{{ filename }}"

  - id: daily
    when:
      field.type: daily
    then:
      move_to: "General/Journal/{{ field.date | year }}/{{ field.date | month }}/{{ filename }}"

  - id: note-customer-stream
    when:
      all:
        - field.type: note
        - field.customer: "*"
        - field.stream: "*"
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/Streams/{{ filename }}"

  - id: note-customer
    when:
      all:
        - field.type: note
        - field.customer: "*"
    then:
      move_to: "Customers/{{ field.customer | unwikilink }}/{{ filename }}"

  - id: note-general
    when:
      field.type: note
    then:
      move_to: "General/{{ filename }}"
