views:
  - id: all-notes
    name: All Notes
    icon: 📄
    data_source: "SELECT path, title FROM v_notes ORDER BY path"

  - id: tasks
    name: Tasks
    icon: ✅
    data_source: "SELECT note_path AS path, text AS title, status_group FROM v_tasks ORDER BY status_group, note_path, line_number"
    group_by: status_group

  - id: recent
    name: Recent
    icon: 🕐
    data_source: "SELECT path, title, updated_at FROM v_notes ORDER BY updated_at DESC LIMIT 30"

  - id: inbox
    name: Inbox
    icon: 📥
    data_source: "SELECT path, title FROM v_notes WHERE path LIKE 'Inbox/%' ORDER BY path"
    badge_query: "SELECT COUNT(*) as count FROM v_notes WHERE path LIKE 'Inbox/%'"

  - id: meetings
    name: Meetings
    icon: 📅
    data_source: >
      SELECT n.path, n.title, d.value AS date
      FROM v_notes n
      JOIN v_field_values k ON k.vault_name = n.vault_name AND k.note_path = n.path
       AND k.key = 'kind' AND k.value = 'meeting'
      LEFT JOIN v_field_values d ON d.vault_name = n.vault_name AND d.note_path = n.path
       AND d.key = 'date'
      ORDER BY d.value DESC
