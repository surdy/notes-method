actions:
  - name: standup
    description: Create today's daily note from template
    steps:
      - type: api
        method: POST
        path: /api/v/main/templates/daily/instantiate
        body:
          folder: "Daily"
      - type: open
        vault: main
        path: "Daily/{date}.md"
  - name: weekly-review
    description: Open the weekly review dashboard
    steps:
      - type: open
        vault: main
        path: "Dashboards/Weekly Review.md"
