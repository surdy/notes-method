schema_version = 1
name = "golden-vault"

[capture]
folder = "Inbox"
template = "generic-note"

[periodic.daily]
folder = "Daily"
template = "daily"
filename = "{{ date }}"
catch_up = false

[periodic.weekly]
folder = "Weekly"
template = "weekly"
filename = "Week {{ week }}"

[periodic.quarterly]
folder = "Quarterly"
template = "quarterly"
filename = "{{ quarter }}"

[editor]
live_preview = true
default_mode = "source"
strict_line_breaks = false
show_line_numbers = true

[git]
enabled = false

# Hooks are intentionally unset in the fixture: the kit documents
# `on_field_change` / `on_periodic_create` scripts, but daemon-backed tests must
# never shell out. See docs/example-work-notes-kit.md for the real config.
[hooks]
