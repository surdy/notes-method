schema_version = 1
name = "golden-vault"

[capture]
folder = "Inbox"
template = "generic-note"

[daily]
folder = "Inbox/Daily"
template = "daily-note"
catch_up = false

[periodic.weekly]
folder = "General/Journal"
filename = "Week {{ week }}"

[editor]
live_preview = true
default_mode = "source"
strict_line_breaks = false
show_line_numbers = true

[git]
enabled = false

[hooks]
