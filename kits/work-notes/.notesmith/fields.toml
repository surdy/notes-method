version = 1

[fields.kind]
type = "enum"
description = "Canonical note type"
values = ["meeting", "stream", "customer", "account", "person", "event"]

[fields.date]
type = "date"
description = "Meeting date"

[fields.audience]
type = "enum"
description = "Did customers attend?"
values = ["internal", "external"]

[fields.meeting_type]
type = "enum"
description = "Meeting format"
values = ["qbr", "discovery", "status", "planning", "retrospective", "1:1"]

[fields.customers]
type = "list"
description = "Customers this note relates to"
multivalue = true
suggest_from = "SELECT DISTINCT value FROM v_field_values WHERE key = 'customers' ORDER BY value"

[fields.streams]
type = "list"
description = "Streams this note relates to"
multivalue = true
suggest_from = "SELECT DISTINCT value FROM v_field_values WHERE key = 'streams' ORDER BY value"

[fields.attendees]
type = "list"
description = "People who attended"
multivalue = true
suggest_from = "SELECT DISTINCT value FROM v_field_values WHERE key = 'attendees' ORDER BY value"

[fields.status]
type = "enum"
description = "Stream lifecycle status"
values = ["active", "waiting", "blocked", "done"]

[fields.priority]
type = "enum"
values = ["P0", "P1", "P2", "P3"]

[fields.started]
type = "date"

[fields.target]
type = "date"

[fields.org]
type = "string"

[fields.role]
type = "string"

[fields.tags]
type = "list"
multivalue = true

# Calendar event fields (ADR 0025 heading D). Populated by the calendar-sync
# connector on `kind: event` notes; `start`/`end` hold ISO datetimes as
# strings so SQL `date()` parses them.
[fields.event_id]
type = "string"
description = "Stable external calendar id — the upsert key for event notes"

[fields.start]
type = "string"
description = "Event start (ISO datetime)"

[fields.end]
type = "string"
description = "Event end (ISO datetime)"

[fields.organizer]
type = "string"
description = "Event organizer email"

# The bridge to Teams transcripts (ADR 0025, 2026-09-04 amendment). Identifies
# the online meeting, not the occurrence: recurring instances reuse one URL, so
# transcript-sync matches timestamps to pick the occurrence.
[fields.join_url]
type = "string"
description = "Teams join URL for an online meeting event"

# Set on a meeting note by transcript-sync: a wikilink to the sidecar
# transcript. The reverse link (`meeting`) lives on the transcript note.
[fields.transcript]
type = "string"
description = "Wikilink to this meeting's sidecar transcript note"

[fields.meeting]
type = "string"
description = "Wikilink from a transcript note back to its meeting"

[fields.source_type]
type = "enum"
description = "Origin of a transcript note"
values = ["teams", "youtube", "audio"]

[fields.source_url]
type = "string"
description = "Stable source identifier — the transcript dedup key"

# Set on a meeting note by the meeting-prefill hook: a wikilink to the
# machine-owned event note the meeting was captured from. Together with
# `event_id` it joins a hand-written meeting to its calendar record.
[fields.event]
type = "string"
description = "Wikilink to the calendar event note this meeting came from"

# Lives on customer notes: maps attendee email domains to the customer so the
# connector can derive `customers`/`audience`. Teaching the connector = editing
# a customer note's `domains`.
[fields.domains]
type = "list"
description = "Email domains that identify this customer"
multivalue = true
suggest_from = "SELECT DISTINCT value FROM v_field_values WHERE key = 'domains' ORDER BY value"
