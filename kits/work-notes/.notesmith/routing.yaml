version: 1
defaults:
  on_exists: rename

rules:
  - id: file-meeting
    when:
      all:
        - path: "Inbox/**"
        - field.kind: "meeting"
        - field.date: "*"
    then:
      move_to: "Meetings/{{ field.date | year }}/{{ field.date | month }}/{{ filename }}"
      remove_tags: [inbox]

  - id: file-stream
    when:
      all:
        - path: "Inbox/**"
        - field.kind: "stream"
    then:
      move_to: "Streams/{{ filename }}"
      remove_tags: [inbox]

  - id: file-person
    when:
      all:
        - path: "Inbox/**"
        - field.kind: "person"
    then:
      move_to: "People/{{ filename }}"
      remove_tags: [inbox]

  # The calendar-sync connector writes event notes straight to their
  # deterministic Calendar/YYYY/MM path, so they never pass through the Inbox.
  # This rule only catches an event that was captured to the Inbox by hand,
  # filing it the same way meetings are filed by date (here by `start`).
  - id: file-event
    when:
      all:
        - path: "Inbox/**"
        - field.kind: "event"
        - field.start: "*"
    then:
      move_to: "Calendar/{{ field.start | year }}/{{ field.start | month }}/{{ filename }}"
      remove_tags: [inbox]
