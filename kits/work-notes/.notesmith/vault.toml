schema_version = 1
name = "{{ vault_name }}"

[capture]
folder = "Inbox"
template = "generic-note"

[periodic.daily]
folder = "Daily"
template = "daily"
filename = "{{ date }}"
catch_up = false

[periodic.weekly]
folder = "Weekly"
template = "weekly"
filename = "Week {{ week }}"

[periodic.quarterly]
folder = "Quarterly"
template = "quarterly"
filename = "{{ quarter }}"

[editor]
live_preview = true
default_mode = "source"
strict_line_breaks = false
show_line_numbers = true

[git]
enabled = false

# Empty by default. docs/example-work-notes-kit.md documents the
# `on_field_change` (blocked-stream notification) and `on_periodic_create`
# (morning briefing) scripts; hook config is read at daemon startup, so restart
# the daemon after enabling one.
[hooks]

# Calendar sync (ADR 0025 Decisions 1/3/4): a connector subprocess that pulls
# M365 calendar events via the Work IQ CLI and upserts them as `kind: event`
# notes under Calendar/ (docs/example-work-notes-kit.md, "Calendar sync").
# Disabled here because it needs the `workiq` CLI installed and authenticated
# plus corp_domains set in .notesmith/connectors/calendar-sync.config.json on
# the machine that runs it; set enabled = true there (takes effect without a
# daemon restart), and remember to `chmod +x` the connector after `kit apply`.
[[jobs]]
name = "calendar-sync"
enabled = false
every = "15m"
command = ".notesmith/connectors/calendar-sync.py"
timeout = "120s"

# Morning daily briefing (issue #288, ADR 0025 Decision 5): renders
# .notesmith/prompts/daily-note.md and drives a headless agent that fills the
# daily note's managed sections (docs/managed-sections.md). Disabled here
# because it needs an external agent CLI on the machine that runs it; set
# enabled = true on that machine (takes effect without a daemon restart).
# `after = ["calendar-sync"]` holds the briefing until calendar-sync has
# succeeded today, so today's meetings are fresh — enable both together on the
# machine, or the briefing waits on a prerequisite that never runs.
[[jobs]]
name = "daily-briefing"
enabled = false
at = "07:30"
weekdays_only = true
after = ["calendar-sync"]
agent = { prompt = "daily-note", allow_writes = true }

# Deterministic email summary (ADR 0025 Decision 3 + the 2026-09-04 fallback-tier
# amendment): a connector subprocess that fills the daily note's `briefing/email`
# section with a metadata-only (sender + subject) digest of unread inbox mail via
# the Work IQ CLI (docs/example-work-notes-kit.md, "Deterministic email summary").
# This is the FALLBACK tier — enable it only on a machine whose briefing agent has
# no Work IQ tool; the agent's judgment-tier summary is preferred when available
# and is never overwritten. It fills briefing/email only when the agent left it
# empty or wrote "Work IQ not connected". `after = ["daily-briefing"]` makes it
# run last, after the agent has had its turn. The runner requires a schedule, so
# it carries `at = "07:35"` (just after the 07:30 briefing) purely as its fire
# time — the `after` gate does the real ordering. Disabled here because it needs
# the `workiq` CLI installed and authenticated on the machine that runs it; set
# enabled = true there (hot-reloaded, no daemon restart) and `chmod +x` the
# connector after `kit apply`. Used WITHOUT the briefing agent, drop the `after`
# line (else it waits on a prerequisite that never runs).
[[jobs]]
name = "email-summary"
enabled = false
at = "07:35"
weekdays_only = true
after = ["daily-briefing"]
command = ".notesmith/connectors/email-summary.py"
timeout = "120s"


# Teams transcript pull (ADR 0025 Decision 4). Runs after calendar-sync, since
# it matches transcripts against the event notes that job writes -- an event
# with no synced `join_url` has no bridge to its transcript. Hourly rather than
# daily: transcripts appear some minutes after a call ends, and the observed
# tenant retention floor was 17 days, so there is no rush but also no backfill.
# Disabled by default; needs the `workiq` CLI and `chmod +x` after `kit apply`.
[[jobs]]
name = "transcript-sync"
enabled = false
every = "1h"
after = ["calendar-sync"]
command = ".notesmith/connectors/transcript-sync.py"
timeout = "300s"
