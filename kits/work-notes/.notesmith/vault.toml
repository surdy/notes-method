schema_version = 1
name = "{{ vault_name }}"

[capture]
folder = "Inbox"
template = "generic-note"

[periodic.daily]
folder = "Daily"
template = "daily"
filename = "{{ date }}"
catch_up = false

[periodic.weekly]
folder = "Weekly"
template = "weekly"
filename = "Week {{ week }}"

[periodic.quarterly]
folder = "Quarterly"
template = "quarterly"
filename = "{{ quarter }}"

[editor]
live_preview = true
default_mode = "source"
strict_line_breaks = false
show_line_numbers = true

[git]
enabled = false

# Empty by default. docs/example-work-notes-kit.md documents the
# `on_field_change` (blocked-stream notification) and `on_periodic_create`
# (morning briefing) scripts; hook config is read at daemon startup, so restart
# the daemon after enabling one.
[hooks]
