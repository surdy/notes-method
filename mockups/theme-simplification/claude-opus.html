<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Notesmith — Theme Explorations · Claude Opus 4.8</title>
<style>
/* ============================================================
   Notesmith Theme Explorations — designed by Claude Opus 4.8
   Nine self-contained concepts. No build step, no network deps.
   All colors are local CSS custom properties; the production
   theme system is untouched.
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

:root {
  --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", "Helvetica Neue", Arial, sans-serif;
  --mono-font: "SF Mono", "JetBrains Mono", "Fira Code", ui-monospace, "Menlo", "Consolas", monospace;
  --serif-font: "Iowan Old Style", "Palatino Linotype", "Georgia", "Times New Roman", serif;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 10px;
  --radius-pill: 999px;

  /* Gallery shell (fixed, concept-independent) */
  --shell-bg: #0f1012;
  --shell-panel: #17181b;
  --shell-line: #2a2c31;
  --shell-text: #e7e8ea;
  --shell-text-2: #a2a5ac;
  --shell-text-3: #6c7078;
  --shell-accent: #7aa2f7;
}

html, body {
  margin: 0;
  height: 100%;
  background: var(--shell-bg);
  color: var(--shell-text);
  font-family: var(--ui-font);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

/* ---------- Gallery chrome ---------- */
.gallery {
  flex: 0 0 auto;
  background: var(--shell-panel);
  border-bottom: 1px solid var(--shell-line);
}
.gallery-top {
  display: flex;
  align-items: baseline;
  gap: 14px;
  padding: 12px 18px 8px;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 9px;
}
.brand-mark {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--shell-text);
}
.brand-mark .dot { color: var(--shell-accent); }
.brand-sub {
  font-size: 12px;
  color: var(--shell-text-3);
  letter-spacing: 0.02em;
}
.author-pill {
  margin-left: auto;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: #cdd6f4;
  background: rgba(122,162,247,0.14);
  border: 1px solid rgba(122,162,247,0.35);
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  white-space: nowrap;
}

.gallery-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  padding: 2px 18px 12px;
}
.tab-group { display: flex; flex-direction: column; gap: 6px; }
.tab-group-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--shell-text-3);
}
.tab-row { display: flex; gap: 6px; }
.concept-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 11px;
  border: 1px solid var(--shell-line);
  border-radius: var(--radius-md);
  background: #1d1f23;
  color: var(--shell-text-2);
  font-family: inherit;
  font-size: 12px;
  font-weight: 550;
  cursor: pointer;
  transition: border-color .15s, color .15s, background .15s;
}
.concept-btn:hover { color: var(--shell-text); border-color: #3a3d44; }
.concept-btn .swatch {
  width: 14px; height: 14px; border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.14);
  flex: 0 0 auto;
}
.concept-btn.active {
  color: #fff;
  background: #262a31;
  border-color: var(--shell-accent);
  box-shadow: inset 0 0 0 1px rgba(122,162,247,0.35);
}

.gallery-caption {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 18px;
  border-top: 1px solid var(--shell-line);
  font-size: 12px;
  color: var(--shell-text-2);
}
.caption-name { font-weight: 700; color: var(--shell-text); }
.caption-cat {
  font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--shell-accent);
  border: 1px solid rgba(122,162,247,0.35);
  border-radius: var(--radius-pill);
  padding: 2px 9px;
}
.caption-desc { color: var(--shell-text-3); }
.caption-nav { margin-left: auto; display: flex; gap: 6px; }
.nav-btn {
  width: 26px; height: 26px;
  border: 1px solid var(--shell-line);
  border-radius: var(--radius-sm);
  background: #1d1f23;
  color: var(--shell-text-2);
  font-family: inherit; font-size: 13px; cursor: pointer;
}
.nav-btn:hover { color: #fff; border-color: #3a3d44; }

/* ---------- Stage ---------- */
.stage {
  flex: 1 1 auto;
  min-height: 0;
  padding: 18px;
  overflow: auto;
  background:
    radial-gradient(120% 120% at 50% 0%, #141518 0%, #0f1012 60%);
}
.stage-frame {
  height: 100%;
  min-height: 560px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 24px 60px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04);
}

/* ============================================================
   WORKSPACE — component styles reference concept tokens only.
   ============================================================ */
.workspace {
  --c-app:#191919; --c-chrome:#1f1f1f; --c-sidebar:#1c1c1c; --c-dock:#1c1c1c;
  --c-status:#1f1f1f; --c-elevated:#262626; --c-hover:#2a2a2a; --c-selected:#2f2f31;
  --c-border:#333; --c-border-subtle:#262626; --c-text:#e6e4e1; --c-text-2:#b4b1ac;
  --c-text-3:#86837e; --c-text-4:#5f5d59; --c-accent:#6ea3f0;
  --c-accent-soft:rgba(110,163,240,0.14); --c-accent-on:#cfe0fb;
  --c-tag-bg:#2a2f38; --c-tag-text:#a9c4ef; --c-shadow:rgba(0,0,0,0.5);
  --c-danger:#e08a7a; --c-success:#86c08a; --c-warning:#d9b36e; --c-dirty:#6ea3f0;

  --e-bg:#1d1d1d; --e-text:#e6e4e1; --e-text-2:#b4b1ac; --e-text-3:#86837e;
  --e-border:#333; --e-link:#6ea3f0; --e-accent:#e6e4e1; --e-code-bg:#242424;
  --e-callout-bg:rgba(110,163,240,0.08); --e-callout-border:#6ea3f0;
  --e-selection:rgba(110,163,240,0.22);
  --sy-com:#6d6a64; --sy-key:#c79be0; --sy-str:#9ec98f; --sy-num:#e0b072;
  --sy-fn:#6ea3f0; --sy-punc:#9a968f;

  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--c-app);
  color: var(--c-text);
  font-size: 13px;
  overflow: hidden;
}

/* -- Top chrome -- */
.ws-chrome {
  display: flex;
  min-height: 40px;
  background: var(--c-chrome);
  border-bottom: 1px solid var(--c-border);
}
.chrome-left, .chrome-right {
  display: flex; align-items: center; gap: 8px;
  padding: 0 10px 0 12px;
  background: var(--c-sidebar);
}
.chrome-left { flex: 0 0 258px; border-right: 1px solid var(--c-border); }
.chrome-right { flex: 0 0 292px; border-left: 1px solid var(--c-border); justify-content: space-between; padding-right: 8px; }
.chrome-main { flex: 1; display: flex; align-items: flex-end; min-width: 0; overflow: hidden; padding: 0 8px; }

.vault-btn {
  display: flex; align-items: center; gap: 7px;
  padding: 5px 9px;
  border: 1px solid transparent;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--c-text);
  font-family: inherit; font-size: 12.5px; font-weight: 600;
  cursor: pointer;
}
.vault-btn:hover { background: var(--c-hover); }
.vault-glyph {
  width: 18px; height: 18px; border-radius: 5px;
  background: var(--c-accent-soft);
  color: var(--c-accent);
  display: grid; place-items: center; font-size: 11px; font-weight: 800;
}
.vault-caret { color: var(--c-text-3); font-size: 10px; }
.chrome-spacer { flex: 1; }

.icon-btn {
  width: 28px; height: 28px;
  display: grid; place-items: center;
  border: 1px solid transparent; border-radius: var(--radius-md);
  background: transparent; color: var(--c-text-3); cursor: pointer;
}
.icon-btn:hover { background: var(--c-hover); color: var(--c-text); }
.icon-btn svg { width: 16px; height: 16px; }

.chrome-note-title {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--c-text); font-size: 12.5px; font-weight: 600;
}

/* -- Tabs -- */
.ws-tabs { display: flex; gap: 4px; align-items: stretch; }
.ws-tab {
  display: flex; align-items: center; gap: 7px;
  max-width: 220px;
  padding: 7px 10px 8px;
  background: var(--c-elevated);
  border-top: 2px solid transparent;
  border-radius: var(--radius-md) var(--radius-md) 0 0;
  color: var(--c-text-2);
  cursor: pointer;
  font-size: 12.5px;
}
.ws-tab:hover { color: var(--c-text); }
.ws-tab.active {
  background: var(--e-bg);
  color: var(--e-text);
  border-top-color: var(--c-accent);
}
.ws-tab .t-icon { font-size: 12px; line-height: 1; }
.ws-tab .t-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-tab .t-dirty { color: var(--c-dirty); font-size: 9px; }
.ws-tab .t-close {
  color: var(--c-text-3); border: none; background: transparent; cursor: pointer;
  font-size: 14px; line-height: 1; padding: 0 2px; opacity: 0;
}
.ws-tab:hover .t-close, .ws-tab.active .t-close { opacity: 1; }
.ws-tab .t-close:hover { color: var(--c-text); }
.ws-tab.active .t-close { color: var(--e-text-3); }
.ws-tab.active .t-close:hover { color: var(--e-text); }

/* -- Body columns -- */
.ws-body { flex: 1; display: flex; min-height: 0; overflow: hidden; }

.ws-sidebar {
  flex: 0 0 258px;
  display: flex; flex-direction: column;
  background: var(--c-sidebar);
  border-right: 1px solid var(--c-border);
  overflow: hidden;
}
.side-tabs {
  display: flex; gap: 2px;
  padding: 8px 8px 0;
  border-bottom: 1px solid var(--c-border-subtle);
}
.side-tab {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px 8px;
  border: none; background: transparent;
  color: var(--c-text-3); cursor: pointer;
  font-family: inherit; font-size: 12px; font-weight: 600;
  border-bottom: 2px solid transparent;
}
.side-tab:hover { color: var(--c-text); }
.side-tab.active { color: var(--c-text); border-bottom-color: var(--c-accent); }
.side-tab .s-badge {
  font-size: 10px; font-weight: 700;
  color: var(--c-accent-on); background: var(--c-accent-soft);
  border-radius: var(--radius-pill); padding: 1px 6px;
}

.side-search { padding: 10px; }
.search-field {
  display: flex; align-items: center; gap: 7px;
  padding: 6px 9px;
  background: var(--c-elevated);
  border: 1px solid var(--c-border);
  border-radius: var(--radius-md);
}
.search-field svg { width: 14px; height: 14px; color: var(--c-text-3); flex: 0 0 auto; }
.search-field input {
  flex: 1; min-width: 0;
  border: none; background: transparent;
  color: var(--c-text); font-family: inherit; font-size: 12.5px;
  outline: none;
}
.search-field input::placeholder { color: var(--c-text-4); }

.tree { flex: 1; overflow-y: auto; padding: 2px 8px 12px; }
.tree-row {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  width: 100%;
  padding: 5px 8px;
  border: none; background: transparent;
  color: var(--c-text-2);
  font-family: inherit; font-size: 12.5px; text-align: left;
  border-radius: var(--radius-sm); cursor: pointer;
}
.tree-row:hover { background: var(--c-hover); }
.tree-row.folder { color: var(--c-text-2); font-weight: 600; }
.tree-row.note { color: var(--c-text); }
.tree-row.note.selected {
  background: var(--c-selected); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--c-accent);
}
.tree-row .chev {
  width: 0; height: 0; flex: 0 0 auto;
  border-top: 4px solid transparent; border-bottom: 4px solid transparent;
  border-left: 5px solid var(--c-text-3);
  transition: transform .15s;
}
.tree-row.folder.open .chev { transform: rotate(90deg); }
.tree-row .ic { width: 15px; text-align: center; flex: 0 0 auto; font-size: 12px; }
.tree-row .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tree-indent { display: inline-block; flex: 0 0 auto; }
.tree-children.collapsed { display: none; }

.side-section { border-top: 1px solid var(--c-border-subtle); padding: 4px 0 8px; }
.section-head {
  display: flex; align-items: center; gap: 6px;
  width: 100%;
  padding: 8px 14px;
  border: none; background: transparent;
  color: var(--c-text-3);
  font-family: inherit; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.06em; text-transform: uppercase;
  cursor: pointer;
}
.section-head .sc { font-size: 9px; color: var(--c-text-4); }
.recent-item {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 5px 14px 5px 22px;
  border: none; background: transparent;
  color: var(--c-text-2);
  font-family: inherit; font-size: 12.5px; text-align: left; cursor: pointer;
}
.recent-item:hover { background: var(--c-hover); color: var(--c-text); }
.recent-item .ic { font-size: 12px; }

/* -- Editor column -- */
.ws-editor { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--e-bg); }
.editor-toolbar {
  display: flex; align-items: center;
  height: 40px; padding: 0 16px;
  background: var(--e-bg);
  border-bottom: 1px solid var(--e-border);
  color: var(--e-text-3); font-size: 12px;
  flex: 0 0 auto;
}
.crumb { display: flex; align-items: center; gap: 3px; min-width: 0; overflow: hidden; }
.crumb .seg { color: var(--e-text-3); white-space: nowrap; }
.crumb .seg.leaf { color: var(--e-text); font-weight: 600; }
.crumb .sep { color: var(--e-text-3); opacity: 0.5; }
.toolbar-right { margin-left: auto; }
.viewmodes {
  display: flex; gap: 3px; padding: 3px;
  border: 1px solid var(--e-border); border-radius: var(--radius-sm);
}
.vmode {
  width: 26px; height: 24px;
  display: grid; place-items: center;
  border: none; border-radius: var(--radius-sm);
  background: transparent; color: var(--e-text-3); cursor: pointer;
}
.vmode svg { width: 14px; height: 14px; }
.vmode:hover { background: var(--e-code-bg); color: var(--e-text); }
.vmode.active { background: var(--c-accent-soft); color: var(--c-accent); }

.editor-scroll { flex: 1; overflow-y: auto; }
.doc {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 56px 120px;
  color: var(--e-text);
  line-height: 1.68;
  font-size: 15.5px;
}
.doc ::selection { background: var(--e-selection); }
.doc h1 {
  font-size: 30px; font-weight: 700; letter-spacing: -0.015em;
  line-height: 1.2; margin: 0 0 6px; color: var(--e-accent);
}
.doc .subtitle { color: var(--e-text-3); font-size: 14px; margin: 0 0 26px; }
.doc h2 {
  font-size: 20px; font-weight: 650; letter-spacing: -0.01em;
  margin: 34px 0 12px; color: var(--e-accent);
  padding-bottom: 6px; border-bottom: 1px solid var(--e-border);
}
.doc h3 { font-size: 16px; font-weight: 650; margin: 24px 0 8px; color: var(--e-accent); }
.doc p { margin: 0 0 15px; color: var(--e-text); }
.doc p.muted { color: var(--e-text-2); }
.doc ul { margin: 0 0 15px; padding-left: 22px; }
.doc li { margin: 4px 0; }
.doc a.wikilink {
  color: var(--e-link); text-decoration: none;
  border-bottom: 1px solid color-mix(in srgb, var(--e-link) 35%, transparent);
  cursor: pointer;
}
.doc a.wikilink:hover { border-bottom-color: var(--e-link); }
.doc strong { color: var(--e-accent); font-weight: 650; }
.doc em { color: var(--e-text-2); }
.doc code.inline {
  font-family: var(--mono-font); font-size: 0.86em;
  background: var(--e-code-bg); color: var(--e-text);
  padding: 1px 6px; border-radius: 4px;
  border: 1px solid var(--e-border);
}

.callout {
  display: flex; gap: 12px;
  margin: 18px 0;
  padding: 13px 16px;
  background: var(--e-callout-bg);
  border: 1px solid var(--e-border);
  border-left: 3px solid var(--e-callout-border);
  border-radius: var(--radius-md);
}
.callout .co-icon {
  flex: 0 0 auto; color: var(--e-callout-border); font-weight: 800; font-size: 15px;
}
.callout .co-body { font-size: 14px; }
.callout .co-title { font-weight: 700; color: var(--e-accent); margin-bottom: 2px; }
.callout .co-body p { margin: 0; color: var(--e-text-2); }

.codeblock {
  margin: 18px 0;
  background: var(--e-code-bg);
  border: 1px solid var(--e-border);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.code-head {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--e-border);
  font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--e-text-3);
}
.code-head .lang-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c-accent); }
.codeblock pre {
  margin: 0; padding: 14px 16px; overflow-x: auto;
  font-family: var(--mono-font); font-size: 13px; line-height: 1.6;
  color: var(--e-text);
}
.sy-com { color: var(--sy-com); font-style: italic; }
.sy-key { color: var(--sy-key); }
.sy-str { color: var(--sy-str); }
.sy-num { color: var(--sy-num); }
.sy-fn  { color: var(--sy-fn); }
.sy-punc{ color: var(--sy-punc); }

.tasklist { list-style: none; padding-left: 2px; margin: 0 0 15px; }
.tasklist li { display: flex; align-items: flex-start; gap: 10px; margin: 7px 0; }
.tasklist .box {
  flex: 0 0 auto; width: 16px; height: 16px; margin-top: 2px;
  border: 1.5px solid var(--e-text-3); border-radius: 4px;
  display: grid; place-items: center; font-size: 11px; color: transparent;
}
.tasklist li.done .box {
  background: var(--c-accent); border-color: var(--c-accent); color: var(--c-app);
}
.tasklist li.done .task-text { color: var(--e-text-3); text-decoration: line-through; }

.tagrow { display: flex; flex-wrap: wrap; gap: 7px; margin: 20px 0 0; }
.doc-tag {
  font-size: 12px; color: var(--c-tag-text); background: var(--c-tag-bg);
  padding: 3px 10px; border-radius: var(--radius-pill);
}

/* -- Right dock -- */
.ws-dock {
  flex: 0 0 292px;
  display: flex; flex-direction: column;
  background: var(--c-dock);
  border-left: 1px solid var(--c-border);
  overflow: hidden;
}
.dock-tabs {
  display: flex; gap: 2px; padding: 0 8px;
  background: var(--c-chrome);
  border-bottom: 1px solid var(--c-border-subtle);
}
.dock-tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 12px;
  border: none; background: transparent;
  color: var(--c-text-3); cursor: pointer;
  font-family: inherit; font-size: 10px; font-weight: 600;
  border-bottom: 2px solid transparent;
}
.dock-tab svg { width: 16px; height: 16px; }
.dock-tab:hover { color: var(--c-text); }
.dock-tab.active { color: var(--c-text); border-bottom-color: var(--c-accent); }
.dock-tab.chat { color: var(--c-accent); }
.dock-body { flex: 1; overflow-y: auto; }
.dock-pane { display: none; }
.dock-pane.active { display: block; }

.meta-card {
  margin: 12px;
  padding: 12px 4px 4px;
  border: 1px solid var(--c-border-subtle);
  border-radius: var(--radius-lg);
  background: var(--c-elevated);
  box-shadow: 0 1px 2px var(--c-shadow);
}
.meta-row { display: flex; flex-direction: column; gap: 4px; padding: 0 14px 12px; }
.meta-key { font-size: 10.5px; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c-text-3); }
.meta-val { font-size: 13px; color: var(--c-text); }
.meta-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.meta-tag {
  font-size: 12px; color: var(--c-tag-text); background: var(--c-tag-bg);
  padding: 2px 9px; border-radius: var(--radius-pill);
}

.links-group { padding: 6px 0; }
.links-group + .links-group { border-top: 1px solid var(--c-border-subtle); }
.links-head {
  margin: 0; padding: 12px 16px 8px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--c-text-3);
}
.link-item {
  display: flex; flex-direction: column; gap: 3px;
  width: 100%; padding: 9px 16px;
  border: none; background: transparent;
  color: var(--c-text); text-align: left; cursor: pointer;
  font-family: inherit;
}
.link-item:hover { background: var(--c-hover); }
.link-label { font-size: 13px; font-weight: 600; }
.link-path { font-size: 11.5px; color: var(--c-text-3); }
.link-sig { display: flex; gap: 6px; margin-top: 3px; }

/* -- Status bar -- */
.ws-status {

  flex: 0 0 auto;
}
.status-conn { display: flex; align-items: center; gap: 7px; }
.conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c-success); }
.status-vault { flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-right { display: flex; align-items: center; gap: 16px; font-variant-numeric: tabular-nums; }
.git-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px;
  border: 1px solid var(--c-border); border-radius: var(--radius-sm);
  background: transparent; color: var(--c-text-3);
  font-family: inherit; font-size: 11.5px; cursor: pointer;
}
.git-badge:hover { color: var(--c-text); border-color: var(--c-accent); }
.git-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent); }
.save-ok { color: var(--c-success); }

      nodes.forEach(function (n) {

          var f = document.createElement("button");

          var kids = document.createElement("div");
          kids.className = "tree-children" + (n.open ? "" : " collapsed");

          render(n.children, kids);
          f.addEventListener("click", function () {
            n.open = !n.open;

            f.classList.toggle("open", n.open);
            f.querySelector(".ic").textContent = n.open ? "📂" : "📁";

      var wrap = document.createElement("div"); wrap.className = "toc-list";
      wrap.innerHTML = '<div style="padding:16px;color:var(--c-text-3);font-size:13px;line-height:1.6">' +
        'Ask the assistant about <strong style="color:var(--c-text)">' + n.title + '</strong> — summarize it, find gaps, or draft the next atomic note.</div>';
      body.appendChild(wrap);
    }
  }

  function linkGroup(title, items) {
    var g = document.createElement("div"); g.className = "links-group";
    var h = document.createElement("h3"); h.className = "links-head";
    h.textContent = title + " (" + items.length + ")";
    g.appendChild(h);
    items.forEach(function (it) {
      var b = document.createElement("button"); b.type = "button"; b.className = "link-item";
      var sig = "";
      if (it[2]) sig = '<span class="link-sig">' + it[2].map(function (s) { return '<span class="link-tag">' + s + '</span>'; }).join("") + '</span>';
      b.innerHTML = '<span class="link-label">' + it[0] + '</span><span class="link-path">' + it[1] + '</span>' + sig;
      var key = pathKey(it[1]);
      b.addEventListener("click", function () { if (key && NOTES[key]) openNote(key); });
      g.appendChild(b);
    });
    return g;
  }

  function pathKey(path) {
    if (path.indexOf("Atomic Notes") > -1) return "atomic";
    if (path.indexOf("Daily · 2026-07-11") > -1) return "daily";
    if (path.indexOf("Zettelkasten") > -1) return "zettel";
    if (path.indexOf("Project · Notesmith") > -1) return "project";
    return null;
  }

  /* ---------- Dock tab switching ---------- */
  function bindDockTabs() {
    Array.prototype.forEach.call(el("dockTabs").querySelectorAll(".dock-tab"), function (t) {
      t.addEventListener("click", function () {
        state.pane = t.dataset.pane;
        Array.prototype.forEach.call(el("dockTabs").querySelectorAll(".dock-tab"), function (x) {
          x.classList.toggle("active", x === t);
        });
        renderPane();
      });
    });
  }

  /* ---------- Recently-viewed shortcuts ---------- */
  function bindRecents() {
    Array.prototype.forEach.call(document.querySelectorAll(".recent-item"), function (b) {
      b.addEventListener("click", function () {
        var key = b.dataset.open;
        if (key && NOTES[key]) openNote(key);
      });
    });
  }

  /* ---------- View-mode toggle (visual only) ---------- */
  function bindViewModes() {
    Array.prototype.forEach.call(document.querySelectorAll(".vmode"), function (b) {
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(document.querySelectorAll(".vmode"), function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll(".side-tab"), function (b) {
      b.addEventListener("click", function () {
        Array.prototype.forEach.call(document.querySelectorAll(".side-tab"), function (x) { x.classList.remove("active"); });
        b.classList.add("active");
      });
    });
  }

  /* ---------- Init ---------- */
  buildGallery();
  buildTree();
  buildTabs();
  bindDockTabs();
  bindRecents();
  bindViewModes();
  var initial = (location.hash || "").replace("#", "");
  var valid = CONCEPTS.some(function (c) { return c.id === initial; });
  setConcept(valid ? initial : "graphite");
  renderNote();

  el("prevBtn").addEventListener("click", function () { stepConcept(-1); });
  el("nextBtn").addEventListener("click", function () { stepConcept(1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft" && e.altKey) { stepConcept(-1); e.preventDefault(); }
    if (e.key === "ArrowRight" && e.altKey) { stepConcept(1); e.preventDefault(); }
  });
})();
</script>
</body>
</html>
