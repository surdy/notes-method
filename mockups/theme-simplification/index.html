<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notesmith Theme Mockups</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
    }
    body {
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
      height: 100vh;
      margin: 0;
      overflow: hidden;
      background: #0c0e11;
      color: #f2f4f7;
    }
    button, a { font: inherit; color: inherit; }
    .bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      padding: 0 16px 0 20px;
      border-bottom: 1px solid #292e36;
      background: #12151a;
    }
    .title {
      font-size: 13px;
      font-weight: 720;
      letter-spacing: -.01em;
    }
    .title span {
      margin-left: 8px;
      color: #7f8895;
      font-size: 11px;
      font-weight: 500;
    }
    .switcher {
      display: flex;
      gap: 3px;
      padding: 3px;
      border: 1px solid #2b313a;
      border-radius: 9px;
      background: #191d23;
    }
    .switcher button {
      padding: 7px 13px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #9199a5;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
    }
    .switcher button.active {
      background: #2a3039;
      color: #f4f6f8;
      box-shadow: inset 0 0 0 1px #39414d;
    }
    .open {
      justify-self: end;
      padding: 7px 11px;
      border: 1px solid #303640;
      border-radius: 7px;
      background: #1b1f26;
      color: #cbd1d9;
      font-size: 11px;
      text-decoration: none;
    }
    .open:hover { border-color: #699bf0; color: #fff; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      background: #0d0f12;
    }
  </style>
</head>
<body>
  <header class="bar">
    <div class="title">Notesmith theme study <span>18 interactive concepts</span></div>
    <nav class="switcher" aria-label="Designer">
      <button type="button" class="active" data-file="copilot.html">Copilot · 9</button>
      <button type="button" data-file="claude-opus.html">Claude Opus 4.8 · 9</button>
    </nav>
    <a class="open" id="openLink" href="copilot.html" target="_blank" rel="noreferrer">Open full window ↗</a>
  </header>
  <iframe id="viewer" src="copilot.html" title="Theme mockup gallery"></iframe>
  <script>
    const viewer = document.getElementById("viewer");
    const openLink = document.getElementById("openLink");
    document.querySelectorAll(".switcher button").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".switcher button").forEach(item => item.classList.remove("active"));
        button.classList.add("active");
        viewer.src = button.dataset.file;
        openLink.href = button.dataset.file;
      });
    });
  </script>
</body>
</html>
