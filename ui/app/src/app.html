<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(function () {
				var defaults = {
					theme: 'dark',
					followSystem: false,
					darkTheme: 'dark',
					lightTheme: 'light',
					visualMode: 'default'
				};
				var state = defaults;
				var legacyLightThemes = {
					'ayu-light': true,
					'catppuccin-latte': true,
					'everforest-light': true,
					'github-light': true,
					'gruvbox-light': true,
					'notesmith-light': true,
					'one-light': true,
					'rose-pine-dawn': true,
					'solarized-light': true,
					'vitesse-light': true
				};
				var canonicalThemes = { dark: true, light: true, split: true };
				var legacy = {
					dark: { theme: 'dark', followSystem: false },
					light: { theme: 'light', followSystem: false },
					system: {
						theme: 'dark',
						followSystem: true,
						darkTheme: 'dark',
						lightTheme: 'light'
					},
					manuscript: { theme: 'split', followSystem: false },
					'hc-dark': {
						theme: 'dark',
						followSystem: false,
						visualMode: 'high-contrast'
					}
				};

				function normalizeTheme(theme) {
					if (canonicalThemes[theme]) return theme;
					if (theme === 'manuscript') return 'split';
					if (legacyLightThemes[theme]) return 'light';
					return 'dark';
				}

				function normalizeDarkTheme(theme) {
					var normalized = normalizeTheme(theme);
					return normalized === 'light' ? defaults.darkTheme : normalized;
				}

				function normalizeLightTheme(theme) {
					return normalizeTheme(theme) === 'light' ? 'light' : defaults.lightTheme;
				}

				function mergeState(partial) {
					var next = partial && typeof partial === 'object' ? partial : {};
					return {
						theme: normalizeTheme(next.theme || defaults.theme),
						followSystem: typeof next.followSystem === 'boolean' ? next.followSystem : defaults.followSystem,
						darkTheme: normalizeDarkTheme(next.darkTheme || defaults.darkTheme),
						lightTheme: normalizeLightTheme(next.lightTheme || defaults.lightTheme),
						visualMode: next.visualMode || defaults.visualMode
					};
				}

				function migrateOldState(parsed) {
					if (parsed.mode !== undefined && parsed.followSystem === undefined) {
						var followSystem = parsed.mode === 'system';
						var parsedTheme = normalizeTheme(parsed.theme || defaults.theme);
						if (parsed.mode === 'light') {
							return {
								theme: defaults.lightTheme,
								followSystem: false,
								darkTheme: defaults.darkTheme,
								lightTheme: defaults.lightTheme,
								visualMode: parsed.visualMode || defaults.visualMode
							};
						}
						if (!followSystem) {
							return {
								theme: parsedTheme === 'light' ? defaults.darkTheme : parsedTheme,
								followSystem: false,
								darkTheme: defaults.darkTheme,
								lightTheme: defaults.lightTheme,
								visualMode: parsed.visualMode || defaults.visualMode
							};
						}
						var isLightTheme = parsedTheme === 'light';
						return {
							theme: parsedTheme,
							followSystem: followSystem,
							darkTheme: isLightTheme ? defaults.darkTheme : parsedTheme,
							lightTheme: isLightTheme ? parsedTheme : defaults.lightTheme,
							visualMode: parsed.visualMode || defaults.visualMode
						};
					}
					return parsed;
				}

				try {
					var stored = localStorage.getItem('notesmith:theme');
					if (stored) {
						try {
							var parsed = JSON.parse(stored);
							state =
								typeof parsed === 'string'
									? mergeState(legacy[parsed] || { theme: parsed })
									: mergeState(migrateOldState(parsed));
						} catch (_) {
							state = mergeState(legacy[stored] || { theme: stored });
						}
					}
				} catch (_) {}

				var activeTheme = state.theme || defaults.theme;
				if (state.followSystem) {
					activeTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
						? state.darkTheme || defaults.darkTheme
						: state.lightTheme || defaults.lightTheme;
				}

				var tone = activeTheme === 'light' ? 'light' : 'dark';

				var html = document.documentElement;
				html.setAttribute('data-theme', activeTheme);
				html.setAttribute('data-tone', tone);
				html.setAttribute('data-mode', state.visualMode || 'default');
				html.style.colorScheme = tone;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
