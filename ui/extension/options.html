<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notesmith Web Clipper — Settings</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        max-width: 480px;
        margin: 24px auto;
        padding: 0 16px;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
      }
      label {
        display: block;
        margin: 16px 0 4px;
        font-weight: 600;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        font: inherit;
      }
      button {
        margin-top: 18px;
        padding: 8px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        min-height: 18px;
        color: #27ae60;
      }
      .hint {
        color: #888;
        font-size: 12px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <h1>Notesmith Web Clipper</h1>

    <label for="baseUrl">Daemon base URL</label>
    <input id="baseUrl" type="url" placeholder="http://127.0.0.1:27183" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <p class="hint">
      Local daemon default is <code>http://127.0.0.1:27183</code>. Point this at a
      remote Notesmith daemon if you run one.
    </p>

    <label for="defaultVault">Default vault (optional)</label>
    <input id="defaultVault" type="text" placeholder="leave blank to use the daemon default" autocapitalize="off" autocorrect="off" spellcheck="false" />

    <button id="save">Save</button>
    <div class="status" id="status"></div>

    <script type="module" src="options.js"></script>
  </body>
</html>
